<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #ffffff;
            margin: 0;
            padding: 0;
            background-color: #2c3e50; /* Dark background */
        }
        .container {
            width: 100%;
            max-width: 600px;
            margin: 20px auto;
            background-color: #34495e; /* Dark gray container */
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 2px solid #7f8c8d;
        }
        .header img {
            width: 150px;
        }
        .header h1 {
            color: #ecf0f1;
            font-size: 24px;
            margin-top: 10px;
        }
        .body {
            padding: 20px;
            line-height: 1.6;
            color: #ecf0f1;
        }
        .body p {
            margin-bottom: 12px;
        }
        .highlight {
            background-color: #1abc9c;
            color: #2c3e50;
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
        }
        .cta-button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 18px;
            background-color: #1abc9c;
            color: #2c3e50;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
        .cta-button:hover {
            background-color: #16a085;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #95a5a6;
            margin-top: 30px;
        }
        .footer p {
            margin-top: 5px;
        }
        a {
            color: #1abc9c;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="cid:logo_image" alt="Logo">
            <h1>TPRX</h1>
        </div>

        <div class="body">
            <p>Dear {{fullname}},</p>
            <p class="highlight">{{title}}</p>
            <p>{{message}}</p>

            <p>Thank you for your attention.</p>
            <p>— The TPRX Support Team</p>
        </div>

        <div class="footer">
            <p>Developed by: <a href="https://md360.com.mx"><strong>MD 360</strong></a></p>
            <p>If you did not expect this notification, please ignore this email.</p>
            <p>&copy; 2025 TP Orthodontics. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
